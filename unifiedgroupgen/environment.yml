# From the repository root:
# conda env create -f unifiedgroupgen/environment.yml
# conda activate unifiedgroupgen_cuda
# python -m pip install --no-deps --no-build-isolation -e ./unifiedgroupgen
# Linux CUDA reference: Python 3.10.18 / PyTorch 2.7.1 CUDA 11.8 / NumPy 1.26.4.
# Official backbone cores are bundled; do not install full mattergen/fairchem-core training distributions.
# Optional Windows smoke-test instructions: docs/ENVIRONMENT.md.
# Optional public property models: pip install -e "./unifiedgroupgen[pretrained]"
# Use official wheels, not the mixed metadata/binaries in the old cgdit environment.
name: unifiedgroupgen_cuda
channels:
  - defaults
dependencies:
  - python=3.10.18
  - pip=25.2
  - setuptools=78.1.1
  - wheel=0.45.1
  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu118
