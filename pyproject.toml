[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiedgroupgen"
version = "0.1.0"
description = "Group-orbit constrained material generation with conditional flow matching"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.11", "pyxtal>=1.1.1", "pymatgen>=2024.1", "spglib>=2.5", "pandas>=2.0", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ugg = "unifiedgroupgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
