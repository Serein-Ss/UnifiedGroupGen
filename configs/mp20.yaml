dataset: mp_20
kind: space
data_root: ../data/mp_20
coordinate_mode: fractional
symmetry_tolerance: 0.001
max_atoms: 192
max_orbits: 32
property_columns:
  formation_energy: formation_energy_per_atom
  band_gap: band_gap
  energy_above_hull: e_above_hull
properties:
  formation_energy: {type: scalar}
  band_gap: {type: scalar}
cond_dropout: 0.1
composition_probability: 0.5
observation_probability: 0.25
model: {hidden: 128, proposal_layers: 3, flow_layers: 4, heads: 4, frequencies: 8}
learning_rate: 0.001
batch_size: 8
epochs: 100
