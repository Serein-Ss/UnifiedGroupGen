# Default submission is exactly the two MP-20 EquiformerV2 pilot models.
default_models:
- full_mp20_eqv2_dng
- full_mp20_eqv2_csp
resources:
  partition: '5090'
  gpus: 1
  cpus: 8
  memory: 64G
  hours: 72
calibration:
  candidates:
  - [1, 40000]
  - [2, 40000]
  - [4, 40000]
  - [8, 40000]
  - [16, 60000]
  - [32, 80000]
  - [64, 120000]
  - [128, 160000]
  memory_fraction: 0.85
  reserve_gib: 2
  warmup_steps: 2
  stress_times: [0.05, 0.75, 0.95]
experiments:
  full_mp20_eqv2_dng:
    experiment: full_mp20_eqv2_dng
    dataset: mp_20
    backbone: equiformer_v2
    task: dng
  full_mp20_eqv2_csp:
    experiment: full_mp20_eqv2_csp
    dataset: mp_20
    backbone: equiformer_v2
    task: csp
  full_mp20_eqv2_property:
    experiment: full_mp20_eqv2_property
    dataset: mp_20
    backbone: equiformer_v2
    task: property
  full_c2db51_eqv2_dng:
    experiment: full_c2db51_eqv2_dng
    dataset: c2db_51
    backbone: equiformer_v2
    task: dng
  full_c2db51_eqv2_csp:
    experiment: full_c2db51_eqv2_csp
    dataset: c2db_51
    backbone: equiformer_v2
    task: csp
  full_c2db51_eqv2_property:
    experiment: full_c2db51_eqv2_property
    dataset: c2db_51
    backbone: equiformer_v2
    task: property
  full_joint_eqv2_dng:
    experiment: full_joint_eqv2_dng
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: dng
  full_joint_eqv2_csp:
    experiment: full_joint_eqv2_csp
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: csp
  full_joint_eqv2_property:
    experiment: full_joint_eqv2_property
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: property
  full_mp20_atomgraph_dng:
    experiment: full_mp20_atomgraph_dng
    dataset: mp_20
    backbone: joint_atom_graph
    task: dng
  full_mp20_atomgraph_csp:
    experiment: full_mp20_atomgraph_csp
    dataset: mp_20
    backbone: joint_atom_graph
    task: csp
  full_mp20_atomgraph_property:
    experiment: full_mp20_atomgraph_property
    dataset: mp_20
    backbone: joint_atom_graph
    task: property
