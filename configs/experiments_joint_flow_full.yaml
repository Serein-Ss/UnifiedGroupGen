# Default submission is exactly the two MP-20 EquiformerV2 pilot models.
default_models:
- full_mp20_eqv2_dng
- full_mp20_eqv2_csp
backbone_comparison:
  batch_sizes:
    equiformer_v2: 8
    cspnet: 32
  models:
  - full_mp20_eqv2_dng_improved
  - full_mp20_eqv2_csp_improved
  - full_mp20_cspnet_dng_improved
  - full_mp20_cspnet_csp_improved
paper:
  main_models:
  - full_mp20_eqv2_dng
  - full_mp20_eqv2_csp
  - full_c2db51_eqv2_dng
  - full_c2db51_eqv2_csp
  - full_joint_eqv2_dng
  - full_joint_eqv2_csp
  models:
  - full_mp20_eqv2_dng
  - full_mp20_eqv2_csp
  - full_c2db51_eqv2_dng
  - full_c2db51_eqv2_csp
  ablations: [control, fixed_orbits, no_geometry_feedback]
  seeds: [42, 43, 44]
  evaluation:
    dng_attempts: 10000
    csp_candidates: 20
    sampling_steps: 128
    sampling_batch_size: 4
    seed_offset: 10000
resources:
  partition: '5090'
  gpus: 1
  cpus: 8
  memory: 64G
  hours: 72
calibration:
  candidates: [1, 2, 4, 8, 16, 32, 64, 128]
  memory_fraction: 0.85
  reserve_gib: 2
  warmup_steps: 2
  stress_times: [0.05, 0.75, 0.95]
experiments:
  full_mp20_eqv2_dng:
    experiment: full_mp20_eqv2_dng
    dataset: mp_20
    backbone: equiformer_v2
    task: dng
  full_mp20_eqv2_csp:
    experiment: full_mp20_eqv2_csp
    dataset: mp_20
    backbone: equiformer_v2
    task: csp
  full_mp20_eqv2_property:
    experiment: full_mp20_eqv2_property
    dataset: mp_20
    backbone: equiformer_v2
    task: dng
    property_conditioning: band_gap
  full_c2db51_eqv2_dng:
    experiment: full_c2db51_eqv2_dng
    dataset: c2db_51
    backbone: equiformer_v2
    task: dng
  full_c2db51_eqv2_csp:
    experiment: full_c2db51_eqv2_csp
    dataset: c2db_51
    backbone: equiformer_v2
    task: csp
  full_c2db51_eqv2_property:
    experiment: full_c2db51_eqv2_property
    dataset: c2db_51
    backbone: equiformer_v2
    task: dng
    property_conditioning: band_gap
  full_joint_eqv2_dng:
    experiment: full_joint_eqv2_dng
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: dng
  full_joint_eqv2_csp:
    experiment: full_joint_eqv2_csp
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: csp
  full_joint_eqv2_property:
    experiment: full_joint_eqv2_property
    dataset: mp20_c2db51
    backbone: equiformer_v2
    task: dng
    property_conditioning: band_gap
  full_mp20_atomgraph_dng:
    experiment: full_mp20_atomgraph_dng
    dataset: mp_20
    backbone: joint_atom_graph
    task: dng
  full_mp20_atomgraph_csp:
    experiment: full_mp20_atomgraph_csp
    dataset: mp_20
    backbone: joint_atom_graph
    task: csp
  full_mp20_atomgraph_property:
    experiment: full_mp20_atomgraph_property
    dataset: mp_20
    backbone: joint_atom_graph
    task: dng
    property_conditioning: band_gap
  full_mp20_eqv2_dng_improved:
    experiment: full_mp20_eqv2_dng_improved
    dataset: mp_20
    backbone: equiformer_v2
    task: dng
  full_mp20_eqv2_csp_improved:
    experiment: full_mp20_eqv2_csp_improved
    dataset: mp_20
    backbone: equiformer_v2
    task: csp
  full_mp20_cspnet_dng_improved:
    experiment: full_mp20_cspnet_dng_improved
    dataset: mp_20
    backbone: cspnet
    task: dng
  full_mp20_cspnet_csp_improved:
    experiment: full_mp20_cspnet_csp_improved
