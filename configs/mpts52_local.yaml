dataset: mpts_52
kind: space
data_root: ../data/mpts_52
coordinate_mode: fractional
symmetry_tolerance: 0.01
max_atoms: 416
max_orbits: 52
property_columns:
  formation_energy: formation_energy_per_atom
  energy_above_hull: energy_above_hull
properties:
  formation_energy:
    type: scalar
  energy_above_hull:
    type: scalar
cond_dropout: 0.1
composition_probability: 0.5
observation_probability: 0.25
model:
  proposal_hidden: 256
  proposal_layers: 4
  heads: 8
  flow_hidden: 512
  flow_layers: 6
  frequencies: 128
  checkpoint_layers: true
  edge_chunk_size: 4096
learning_rate: 0.0003
batch_size: 64
epochs: 1000
prepared_root: artifacts/full_tol0p01/mpts_52
element_policy: training
require_data_audit: true
require_full_preparation: true
data_audit: artifacts/full_tol0p01/mpts_52/audit_local.json
minimum_conversion_coverage: 0.95
precision: bf16
edge_budget: 200000
gradient_clip: 10
lr_patience: 10
early_stopping_patience: 50
loss_weights:
  descriptor: 1.0
  flow: 1.0
