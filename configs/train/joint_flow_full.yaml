defaults:
- joint_symmetry
- _self_
# Full-data, independent tasks; no bounded-smoke limits or chemical-set mixing.
batch_size: 8
edge_budget: 40000
epochs: 1000
validation_monitor: val/loss
validation_seed: 918
lr_schedule:
  factor: 0.5
  patience: 10
  threshold: 0.0001
  min_lr: 0.000001
early_stopping:
  patience: 60
  min_delta: 0.0001
event_budget: 96
chemical_set_probability: 0.0
joint_train_limit: null
joint_val_limit: null
joint_max_steps: -1
